<body>

    <p id="demo">Please wait...</p>
    
    <script>
        var notebook_file = "main.ipynb"
        function getQueryVariable(variable) {
            var query = window.location.search.substring(1);
            var vars = query.split('&');
            for (var i = 0; i < vars.length; i++) {
                var pair = vars[i].split('=');
                if (decodeURIComponent(pair[0]) == variable) {
                    return decodeURIComponent(pair[1]);
                }
            }
        }

        window.onload = function() 
        {
            var workspace = getQueryVariable('workspaceId')
            var original_href = window.location.href;
            var voila_href = original_href.replace("impact/customizations", "voila/render/impact/customizations");
            var remove_workspace = voila_href.replace("/workspaces/" + workspace + "/customization", "/customizations");
            var notebook_href = remove_workspace.replace("index.html", notebook_file);
            // similar behavior as clicking on a link
            document.getElementById("demo").innerHTML = "Redirecting with parameters " +
                "<BR>Workspace: " + workspace +
                "<BR>Model: " + getQueryVariable('model') +
                "<BR>Target Url: " + notebook_href;
            window.location.href = notebook_href;
        }

    </script>
    
</body>
